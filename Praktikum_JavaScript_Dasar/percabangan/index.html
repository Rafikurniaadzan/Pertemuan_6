<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Praktikum JS</title>
</head>

<body>
  <script>
    let nilai = 78;
    if (nilai >= 80) {
      console.log("Grade A");
    } else if (nilai >= 70) {
      console.log("Grade B");
    } else {
      console.log("Grade C");
    }
  </script>
</body>

</html>
