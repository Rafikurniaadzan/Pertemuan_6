<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Praktikum JS</title>
</head>

<body>
    <script>
        let a = 10, b = 3;
        console.log(a + b);          // 13
        console.log(a % b);          // 1 (sisa bagi)
        console.log(a > b && b > 0); // true
    </script>
</body>

</html>
